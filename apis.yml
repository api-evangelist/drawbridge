name: Drawbridge
description: 'Drawbridge, Inc. was a San Mateo, California cross-device identity and
  digital advertising company founded in 2011 by Kamakshi Sivaramakrishnan (a former
  AdMob scientist). It built a people-based identity graph that used machine learning
  to probabilistically match individuals across their connected devices (desktops,
  smartphones, tablets, and connected TVs) so brands could serve and measure relevant
  advertising across devices. Backed by Kleiner Perkins, Sequoia Capital, Northgate
  Capital, and Mitsui & Co., the company raised roughly $69M across five rounds before
  it was acquired by LinkedIn in 2019 and folded into LinkedIn Marketing Solutions.
  Drawbridge no longer operates as an independent company and never published a public
  developer API or developer portal, so there is no live API surface to enrich; this
  profile records its identity as a historical Kleiner Perkins portfolio company.'
